<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Obsidian Sidecar</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;padding:12px;background:#f6f8ff;color:#1d2a44}
    textarea,input,select{width:100%;box-sizing:border-box;border:1px solid #dbe4ff;border-radius:10px;padding:8px;margin:6px 0}
    .card{background:#fff;border:1px solid #dbe4ff;border-radius:12px;padding:10px;margin-bottom:10px}
    button{border:0;border-radius:10px;padding:8px 10px;background:#2f6fff;color:#fff;cursor:pointer}
    .muted{font-size:12px;color:#60739c}
    .row{display:flex;gap:8px}
    .row button{flex:1}
    details>summary{cursor:pointer;color:#2f6fff;font-weight:600}
    ul{margin:8px 0;padding-left:18px}
    .danger{background:#d9534f}
  </style>
</head>
<body>
  <div class="card">
    <div><b>最近选中文本</b></div>
    <div id="meta" class="muted">尚未捕获</div>
    <textarea id="selection" rows="6" placeholder="在 ChatGPT 页面选中文字后会出现在这里"></textarea>
  </div>

  <div class="card">
    <div><b>标签 / 备注 / 总结</b></div>
    <select id="tagTemplate">
      <option value="">选择标签模板（可选）</option>
      <option value="#产品 #需求">产品需求</option>
      <option value="#技术 #实现">技术实现</option>
      <option value="#风险 #问题">风险问题</option>
      <option value="#会议 #纪要">会议纪要</option>
    </select>
    <input id="tags" placeholder="例如：#产品 #调研 #AI" />
    <textarea id="note" rows="3" placeholder="你自己的补充说明"></textarea>
    <div class="row">
      <button id="summarizeBtn">自动总结（LLM优先）</button>
      <button id="quickSummaryBtn">快速总结</button>
    </div>
    <textarea id="summary" rows="5" placeholder="总结结果"></textarea>
  </div>

  <div class="card">
    <div><b>批量片段队列（防重复）</b></div>
    <div class="row">
      <button id="enqueueBtn">加入队列</button>
      <button id="clearQueueBtn" class="danger">清空队列</button>
    </div>
    <div id="queueMeta" class="muted">队列 0 条</div>
    <ul id="queueList"></ul>
  </div>

  <div class="card">
    <div><b>写入 Obsidian</b></div>
    <select id="writeMode">
      <option value="rest">Local REST API（推荐）</option>
      <option value="uri">Advanced URI（回退）</option>
    </select>
    <input id="vault" placeholder="Vault 名称（与 Obsidian 一致）" />
    <input id="file" placeholder="目标文档（如 Inbox/ChatGPT-Notes.md）" />
    <div class="row">
      <button id="saveCfgBtn">保存配置</button>
      <button id="writeBtn">写入当前</button>
      <button id="writeQueueBtn">批量写入队列</button>
    </div>
    <div id="status" class="muted"></div>
  </div>

  <details class="card">
    <summary>高级配置（LLM / Obsidian REST / 自动路由）</summary>
    <input id="llmEndpoint" placeholder="LLM Endpoint" />
    <input id="llmApiKey" placeholder="LLM API Key" type="password" />
    <input id="llmModel" placeholder="LLM Model" />
    <input id="obsidianRestBase" placeholder="Obsidian REST Base（默认 http://127.0.0.1:27124）" />
    <input id="obsidianApiKey" placeholder="Obsidian REST API Key" type="password" />
    <textarea id="routeRules" rows="4" placeholder='自动路由规则，每行：#标签=>路径\n例如：\n#产品=>Inbox/Product.md\n#技术=>Inbox/Tech.md'></textarea>
  </details>

  <script src="sidepanel.js"></script>
</body>
</html>
